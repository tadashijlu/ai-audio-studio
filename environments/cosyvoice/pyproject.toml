[project]
name = "dubbing-cosyvoice-runtime"
version = "0.1.0"
description = "Reproducible Windows runtime for the vendored CosyVoice3 engine"
requires-python = ">=3.10,<3.11"
dependencies = [
  "conformer==0.3.2",
  "diffusers==0.39.0",
  "fastapi==0.141.1",
  "gdown==5.1.0",
  "hyperpyyaml==1.2.3",
  "hydra-core==1.3.5",
  "inflect==7.5.0",
  "librosa==0.11.0",
  "lightning==2.6.5",
  "matplotlib==3.10.9",
  "modelscope==1.39.1",
  "networkx==3.4.2",
  "numpy==1.26.4",
  "onnx==1.22.0",
  "onnxruntime==1.18.0; sys_platform == 'win32' or sys_platform == 'darwin'",
  "openai-whisper==20231117",
  "omegaconf==2.3.1",
  "protobuf>=4.25,<5",
  "pyarrow==18.1.0",
  "pydantic==2.13.4",
  "pyworld==0.3.5",
  "rich==13.7.1",
  "ruamel-yaml==0.18.16",
  "setuptools==80.9.0",
  "soundfile==0.14.0",
  "torch==2.3.1",
  "torchaudio==2.3.1",
  "transformers==4.51.3",
  "uvicorn==0.52.1",
  "wetext==0.1.6",
  "wget==3.2",
  "x-transformers==2.11.24",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
